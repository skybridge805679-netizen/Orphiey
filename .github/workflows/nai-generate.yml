# NovelAI V5 에셋 생성. 저장소 시크릿 NAI_TOKEN을 쓴다.
# - tools/nai/jobs/*.json 을 고쳐 푸시하면 그 브랜치에서 자동 실행 → 아직 없는 그림만 만들어 같은 브랜치에 커밋
# - Actions 탭에서 수동 실행도 가능 (force: 있는 그림도 다시)
name: NAI 에셋 생성
on:
  push:
    paths: ['tools/nai/jobs/**']
  workflow_dispatch:
    inputs:
      force:
        description: '이미 있는 그림도 다시 만들기'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 생성
        env:
          NAI_TOKEN: ${{ secrets.NAI_TOKEN }}
        run: node tools/nai/generate.mjs ${{ inputs.force && '--force' || '' }}
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "orpheia-nai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nai tools/nai/log 2>/dev/null || true
          if git diff --cached --quiet; then echo "새 그림 없음"; exit 0; fi
          git commit -m "NAI 생성 결과 (${GITHUB_SHA::7})"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
